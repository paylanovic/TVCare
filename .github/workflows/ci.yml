name: TVCare verified host packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tvcare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package and smoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Reject personal information and private source material
        run: python scripts/privacy_check.py --source
      - name: Test, build, and smoke this host
        run: python scripts/build_release.py
      - name: Smoke the actual extracted release archive
        shell: bash
        run: |
          for archive in dist/TVCare-*.zip; do
            python scripts/package_smoke.py --archive "$archive" --output "${archive%.zip}-smoke.json"
          done
      - name: Preserve verified host archive and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TVCare-${{ matrix.os }}
          path: |
            dist/TVCare-*.zip
            dist/TVCare-*-smoke.json
            dist/TVCare/BUILD.json
            dist/TVCare/SMOKE.json
          if-no-files-found: error
          retention-days: 14
